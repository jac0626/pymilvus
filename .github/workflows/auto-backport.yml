name: Auto Cherry Pick

on:
  pull_request_target:
    types: [closed, labeled]

jobs:
  cherry_pick:
    # Trigger only when merged AND the label contains the specific keyword
    if: >
      github.event.pull_request.merged == true &&
      contains(toJSON(github.event.pull_request.labels.*.name), 'need to cherry-pick')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Analyze Label & Find Target Branch
        id: find_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # 1. Fetch all labels for the current PR
          ALL_LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          
          # 2. Filter for label matching format '... to N.x' (e.g., 'PR | need to cherry-pick to 2.x')
          TARGET_LABEL=$(echo "$ALL_LABELS" | grep -oP '.*to [0-9]+\.x.*' | head -n 1)

          if [ -z "$TARGET_LABEL" ]; then
            echo "::error::Target label format '... to N.x' not found in PR labels."
            gh pr comment $PR_NUMBER --body "❌ **Auto Cherry Pick Failed**
            @$PR_AUTHOR could not find a label matching format \`... to N.x\` (e.g., \`need to cherry-pick to 2.x\`)."
            exit 1
          fi
          
          echo "Processing Label: $TARGET_LABEL"

          # 3. Extract Major Version (e.g., extracts '2' from '2.x')
          MAJOR_VER=$(echo "$TARGET_LABEL" | grep -oP 'to \K[0-9]+(?=\.x)')

          if [ -z "$MAJOR_VER" ]; then
            echo "::error::Could not extract major version from label."
            gh pr comment $PR_NUMBER --body "❌ **Auto Cherry Pick Failed**
            @$PR_AUTHOR could not extract version number from label: \`$TARGET_LABEL\`."
            exit 1
          fi
          echo "Identified Major Version: $MAJOR_VER"

          # 4. Find the latest remote branch matching the major version
          # Logic: List refs -> Filter 'release/2.10' or '2.10' -> Sort by Version -> Take Last
          TARGET_BRANCH=$(git ls-remote --heads origin | awk '{print $2}' | sed 's/refs\/heads\///' | grep -P "(^|/)${MAJOR_VER}\.[0-9]+$" | sort -V | tail -n 1)

          if [ -z "$TARGET_BRANCH" ]; then
            echo "::error::No matching branch found for version $MAJOR_VER.x"
            gh pr comment $PR_NUMBER --body "❌ **Auto Cherry Pick Failed**
            @$PR_AUTHOR no existing branch found matching version \`$MAJOR_VER.x\` (e.g., \`release/$MAJOR_VER.10\`)."
            exit 1
          fi

          echo "Found latest target branch: $TARGET_BRANCH"
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

      - name: Execute Cherry Pick
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          TARGET_BRANCH: ${{ steps.find_branch.outputs.target_branch }}
        run: |
          echo "Preparing to cherry-pick #$PR_NUMBER ($MERGE_COMMIT) to $TARGET_BRANCH"
          
          NEW_BRANCH="backport-$PR_NUMBER-to-$TARGET_BRANCH"
          
          # Check if the backport branch already exists to avoid duplication
          if git ls-remote --exit-code --heads origin $NEW_BRANCH; then
             echo "::warning::Branch $NEW_BRANCH already exists, skipping."
             gh pr comment $PR_NUMBER --body "⚠️ **Auto Cherry Pick Skipped**
             Branch \`$NEW_BRANCH\` already exists. Please check if a backport PR is already open."
             exit 0
          fi

          git checkout -b $NEW_BRANCH origin/$TARGET_BRANCH

          # --- Smart Commit Type Detection ---
          # Check if the commit is a Merge Commit (has 2 parents) or a Squash/Normal Commit (1 parent)
          if git rev-parse -q --verify "$MERGE_COMMIT^2" >/dev/null; then
            echo "Detected Merge Commit (two parents). Using '-m 1'."
            CP_ARGS="-s -m 1"
          else
            echo "Detected Squash/Normal Commit. NOT using '-m 1'."
            CP_ARGS="-s"
          fi

          # --- Run Cherry Pick ---
          if git cherry-pick $CP_ARGS $MERGE_COMMIT; then
            git push origin $NEW_BRANCH
            
            # Create the Backport PR
            NEW_PR_URL=$(gh pr create \
              --base $TARGET_BRANCH \
              --head $NEW_BRANCH \
              --title "[CP] $PR_TITLE" \
              --body "Cherry-pick of #$PR_NUMBER to \`$TARGET_BRANCH\`." \
              --label "backport-pr")
            
            # Success Comment
            gh pr comment $PR_NUMBER --body "✅ **Auto Cherry Pick Success**
            Cherry-picked to \`$TARGET_BRANCH\` in PR: $NEW_PR_URL"
            
            echo "CP_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "::error::Cherry-pick failed."
            
            # Safe Abort (|| true prevents script crash on abort failure)
            git cherry-pick --abort || true
            
            # Failure Comment (Tagging the Author)
            gh pr comment $PR_NUMBER --body "❌ **Auto Cherry Pick Failed**
            Hi @$PR_AUTHOR, I could not cherry-pick this to \`$TARGET_BRANCH\` due to **merge conflicts** or commit incompatibilities.
            
            Please cherry-pick locally and resolve conflicts manually:
            \`\`\`bash
            git checkout $TARGET_BRANCH
            git pull
            git checkout -b backport-$PR_NUMBER
            git cherry-pick $MERGE_COMMIT
            # Resolve conflicts...
            git push origin backport-$PR_NUMBER
            \`\`\`"
            
            exit 1
          fi

      - name: Label Original PR
        if: env.CP_SUCCESS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit $PR_NUMBER --add-label "cherry-picked"