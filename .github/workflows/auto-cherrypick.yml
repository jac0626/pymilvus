name: Backport

on:
  pull_request_target:
    types:
      - closed
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      target_branch:
        description: 'Target branch'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backport:
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Backport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            IS_MANUAL="true"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            IS_MANUAL="false"
          fi

          echo "Starting Backport for PR #$PR_NUMBER (Manual Trigger: $IS_MANUAL)"

          PR_DATA=$(gh pr view $PR_NUMBER --json mergeCommit,title,files,author,state,labels,body --jq .)
          MERGE_COMMIT=$(echo "$PR_DATA" | jq -r .mergeCommit.oid)
          PR_TITLE=$(echo "$PR_DATA" | jq -r .title)
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r .author.login)
          PR_STATE=$(echo "$PR_DATA" | jq -r .state)
          CHANGED_FILES=$(echo "$PR_DATA" | jq -r .files[].path)

          if [ "$PR_STATE" != "MERGED" ]; then
            echo "::error::PR is not merged."
            if [ "$IS_MANUAL" == "true" ]; then
               gh pr comment $PR_NUMBER --body "❌ **Backport Failed**
               PR #$PR_NUMBER is not merged yet."
            fi
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -q "^pymilvus/grpc_gen/"; then
            echo "::notice::Skipping restricted paths."
            gh pr comment $PR_NUMBER --body "⚠️ **Backport Skipped**
            Hi @$PR_AUTHOR, this PR modifies \`pymilvus/grpc_gen/\`. Please backport manually."
            exit 0
          fi

          TARGET_BRANCHES=""
          if [ "$IS_MANUAL" == "true" ]; then
             TARGET_BRANCHES="$INPUT_TARGET_BRANCH"
          else
             TARGET_BRANCHES=$(echo "$PR_DATA" | jq -r '.labels[].name' | grep '^backport-to-' | sed 's/^backport-to-//')
          fi

          if [ -z "$TARGET_BRANCHES" ]; then
             echo "No target branches found."
             exit 0
          fi

          echo "$TARGET_BRANCHES" | while IFS= read -r TARGET_BRANCH; do
            [ -z "$TARGET_BRANCH" ] && continue
            TARGET_BRANCH=$(echo "$TARGET_BRANCH" | xargs)
            
            echo "Processing backport to: $TARGET_BRANCH"

            if ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" > /dev/null; then
               echo "::error::Target branch '$TARGET_BRANCH' does not exist."
               gh pr comment $PR_NUMBER --body "❌ **Backport Failed**
               Target branch \`$TARGET_BRANCH\` does not exist."
               continue
            fi

            BACKPORT_BRANCH="backport-$PR_NUMBER-to-$TARGET_BRANCH-$(date +%s)"
            
            git fetch origin $TARGET_BRANCH
            git checkout -b $BACKPORT_BRANCH origin/$TARGET_BRANCH

            echo "Attempting cherry-pick of $MERGE_COMMIT..."
            
            if git cherry-pick -x -s $MERGE_COMMIT; then
              echo "Cherry-pick successful."
            else
              echo "Standard cherry-pick failed, trying with -m 1..."
              git cherry-pick --abort || true
              
              if git cherry-pick -x -s -m 1 $MERGE_COMMIT; then
                echo "Cherry-pick with -m 1 successful."
              else
                echo "::error::Cherry-pick failed due to conflicts."
                git cherry-pick --abort || true
                
                gh pr comment $PR_NUMBER --body "❌ **Backport Failed**
                Hi @$PR_AUTHOR, I could not cherry-pick this to \`$TARGET_BRANCH\` due to **merge conflicts**.
                Please backport manually."
                continue 
              fi
            fi

            git push origin $BACKPORT_BRANCH
            
            PR_BODY="Backport of #$PR_NUMBER to \`$TARGET_BRANCH\`."
            ASSIGNEE_ARG=""
            if [ "$IS_MANUAL" == "true" ]; then
               PR_BODY="Manual backport of #$PR_NUMBER to \`$TARGET_BRANCH\`."
               ASSIGNEE_ARG="--assignee $ACTOR"
            fi

            NEW_PR_URL=$(gh pr create \
              --base $TARGET_BRANCH \
              --head $BACKPORT_BRANCH \
              --title "[Backport $TARGET_BRANCH] $PR_TITLE" \
              --body "$PR_BODY" \
              --label "backport" \
              $ASSIGNEE_ARG)
            
            gh pr comment $PR_NUMBER --body "✅ **Backport Created**
            Backport PR for \`$TARGET_BRANCH\` created: $NEW_PR_URL"
            
            echo "Backport PR created: $NEW_PR_URL"
          done

      - name: Label Original PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          gh pr edit $PR_NUMBER --add-label "backported" || true
