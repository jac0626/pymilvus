name: Benchmark Suite

on:
  workflow_dispatch:
    inputs:
      run_profiling:
        description: 'Run CPU/Memory profiling'
        required: false
        default: 'true'
        type: boolean
  push:
    branches:
      - benchmark-v2
    paths:
      - 'tests/benchmark/**'
      - 'pymilvus/client/search_result.py'
      - 'pymilvus/client/columnar_search_result.py'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Complete Search Benchmark Suite
  # ==========================================================================
  
  benchmark-search:
    name: Search Benchmarks (Complete)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-benchmark matplotlib numpy grpcio-testing
      
      - name: Run Complete Search Benchmarks
        run: |
          pytest tests/benchmark/test_perf_search.py \
            -v --benchmark-json=search_results.json \
            --benchmark-disable-gc \
            --benchmark-warmup=on
      
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-search
          path: search_results.json
          retention-days: 30

  # ==========================================================================
  # Complete Insert Benchmark Suite
  # ==========================================================================
  
  benchmark-insert:
    name: Insert Benchmarks (Complete)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-benchmark matplotlib numpy grpcio-testing
      
      - name: Run Complete Insert Benchmarks
        run: |
          pytest tests/benchmark/test_perf_insert.py \
            -v --benchmark-json=insert_results.json \
            --benchmark-disable-gc
      
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-insert
          path: insert_results.json
          retention-days: 30

  # ==========================================================================
  # CPU & Memory Profiling
  # ==========================================================================
  
  benchmark-profiling:
    name: CPU & Memory Profiling
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_profiling
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install py-spy memray grpcio-testing
      
      - name: CPU Profiling - Legacy SearchResult
        run: |
          py-spy record -o cpu_legacy.svg --format speedscope -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_iteration --nq 1000 --topk 1000 \
              --result-type legacy --loops 20 || true
      
      - name: CPU Profiling - ColumnarSearchResult
        run: |
          py-spy record -o cpu_columnar.svg --format speedscope -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_iteration --nq 1000 --topk 1000 \
              --result-type columnar --loops 20 || true
      
      - name: CPU Profiling - Insert Preparation
        run: |
          py-spy record -o cpu_insert.svg --format speedscope -- \
            python tests/benchmark/profile_runner.py \
              --scenario insert --batch-size 10000 --loops 10 || true

      - name: CPU Profiling - Random Access (Legacy)
        run: |
          py-spy record -o cpu_random_legacy.svg --format speedscope -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_random --nq 1000 --topk 1000 \
              --access-count 100000 \
              --result-type legacy --loops 10 || true

      - name: CPU Profiling - Random Access (Columnar)
        run: |
          py-spy record -o cpu_random_columnar.svg --format speedscope -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_random --nq 1000 --topk 1000 \
              --access-count 100000 \
              --result-type columnar --loops 10 || true

      - name: CPU Profiling - Columnar Batch
        run: |
          py-spy record -o cpu_columnar_batch.svg --format speedscope -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_columnar --nq 1000 --topk 1000 \
              --result-type columnar --loops 10 || true

      - name: Memory Profiling - Legacy SearchResult
        run: |
          memray run -o mem_legacy.bin -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_iteration --nq 1000 --topk 1000 \
              --result-type legacy --loops 5
          memray flamegraph mem_legacy.bin -o mem_legacy.html
      
      - name: Memory Profiling - ColumnarSearchResult
        run: |
          memray run -o mem_columnar.bin -- \
            python tests/benchmark/profile_runner.py \
              --scenario search_iteration --nq 1000 --topk 1000 \
              --result-type columnar --loops 5
          memray flamegraph mem_columnar.bin -o mem_columnar.html
      
      - name: Memory Profiling - Insert Preparation
        run: |
          memray run -o mem_insert.bin -- \
            python tests/benchmark/profile_runner.py \
              --scenario insert --batch-size 10000 --loops 5
          memray flamegraph mem_insert.bin -o mem_insert.html
      
      - name: Upload Profiling Results
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: |
            cpu_*.svg
            mem_*.html
          retention-days: 30

  # ==========================================================================
  # Generate Report & Plots
  # ==========================================================================
  
  generate-report:
    name: Generate Report & Plots
    runs-on: ubuntu-latest
    needs: [benchmark-search, benchmark-insert]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install plotting dependencies
        run: pip install matplotlib numpy
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results
      
      - name: Generate Plots
        run: |
          mkdir -p plots
          python tests/benchmark/scripts/plot_benchmark_results.py \
            results/**/*.json \
            -o plots/
      
      - name: Create Summary
        run: |
          echo "# Benchmark Results" > report.md
          echo "**Date**: $(date -u)" >> report.md
          echo "**Commit**: ${{ github.sha }}" >> report.md
          echo "**Branch**: ${{ github.ref_name }}" >> report.md
      
      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            plots/
            report.md
            results/
          retention-days: 90
      
      - name: Summary
        run: |
          echo "## ✅ Benchmark Complete" >> $GITHUB_STEP_SUMMARY
          echo "Download **benchmark-report** artifact for plots and data." >> $GITHUB_STEP_SUMMARY
