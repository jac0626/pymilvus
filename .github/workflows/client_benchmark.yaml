name: Client Benchmark & Profiling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pymilvus/client/**'
      - 'tests/benchmark/**'

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # Use Python 3.11 for performance consistency
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          # Install pymilvus + dev dependencies (including py-spy, memray, pytest-benchmark)
          pip install ".[dev]"
          
          # Verify installations
          pip show pymilvus pytest-benchmark memray py-spy

      - name: Grant permissions for Profiling
        # py-spy and memray need elevated permissions to attach to processes
        run: |
          echo "Configuring ptrace..."
          # Allow non-parent processes to trace each other (required for py-spy/memray)
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Run Benchmarks & Profiling
        working-directory: ${{ github.workspace }}
        run: |
          # Ensure we're in the correct directory
          echo "Current directory: $(pwd)"
          
          # Run benchmarks
          # The script is expected to generate files in .benchmarks/ in the current dir
          chmod +x ./tests/benchmark/scripts/run_benchmark_ci.sh
          ./tests/benchmark/scripts/run_benchmark_ci.sh || true
          
          # Debug: Verify files exist before uploading
          echo "Checking for artifacts..."
          if [ -d ".benchmarks" ]; then
            echo "✅ .benchmarks folder found. Contents:"
            ls -la .benchmarks/
          else
            echo "❌ .benchmarks folder NOT found!"
            exit 1
          fi

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          # Fix: Use relative path with wildcard to ensure hidden folder contents are caught
          path: .benchmarks/**
          # Fix: Explicitly allow hidden files since the folder starts with a dot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          